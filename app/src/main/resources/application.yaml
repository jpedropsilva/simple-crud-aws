spring:
  application:
    name: simple-crud-aws
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Actuator Configuration for Local Development
management:
  endpoints:
    web:
      exposure:
        include: health, info # Expose health and info endpoints over HTTP
  endpoint:
    health:
      show-details: always    # Show full component details (DB, disk space, etc.) locally