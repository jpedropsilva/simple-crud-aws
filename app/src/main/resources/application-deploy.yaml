spring:
  application:
    name: simple-crud-aws
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Actuator Configuration for Production
management:
  endpoint:
    health:
      show-details: when-authorized # Only show details if the user is authenticated (or hide them completely with `never`)

  # Best Practice: Run actuator on a separate internal management port
  # so external traffic hitting port 80 cannot access actuator endpoints at all.
  server:
    port: 9090